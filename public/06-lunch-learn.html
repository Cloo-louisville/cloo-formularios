<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Complimentary Virtual Lunch-and-Learn</title>
<link rel="stylesheet" href="assets/form-kit.css">
</head>
<body class="tema-cielo">

<div class="shell">

  <div class="topbar">
    <span class="brandmark">CIELO</span>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>

  <div class="form-wrap">

    <header class="hero">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p data-i18n="offer"></p>
      <p data-i18n="intro"></p>
      <span class="event-badge"></span>
    </header>

    <div class="form-err" role="alert"></div>

    <form class="card" novalidate>

      <div class="hp" aria-hidden="true">
        <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <!-- ============ contacto ============ -->

      <div class="field">
        <label class="label" for="nombre"><span data-i18n="f_name"></span><span class="req">*</span></label>
        <input type="text" id="nombre" name="nombre" data-req autocomplete="name" data-i18n-ph="ph_name">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="email"><span data-i18n="f_email"></span><span class="req">*</span></label>
        <input type="email" id="email" name="email" data-req autocomplete="email" inputmode="email"
               autocapitalize="off" spellcheck="false" data-i18n-ph="ph_email_work">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="telefono"><span data-i18n="f_phone"></span><span class="req">*</span></label>
        <input type="tel" id="telefono" name="telefono" data-req autocomplete="tel" inputmode="tel"
               data-i18n-ph="ph_phone">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="empresa"><span data-i18n="f_org"></span><span class="req">*</span></label>
        <input type="text" id="empresa" name="empresa" data-req autocomplete="organization"
               data-i18n-ph="ph_company">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="rol"><span data-i18n="f_role"></span><span class="req">*</span></label>
        <input type="text" id="rol" name="rol" data-req autocomplete="organization-title"
               data-i18n-ph="ph_role">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_decision"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="decisor" data-req>
          <button type="button" class="chip" data-value="yes"       aria-pressed="false" data-i18n="dc_yes"></button>
          <button type="button" class="chip" data-value="recommend" aria-pressed="false" data-i18n="dc_recommend"></button>
          <button type="button" class="chip" data-value="connect"   aria-pressed="false" data-i18n="dc_connect"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <!-- ============ sobre el equipo ============ -->

      <div class="field">
        <label class="label"><span data-i18n="f_size"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="asistentes" data-req>
          <button type="button" class="chip" data-value="lt10"   aria-pressed="false" data-i18n="sz_lt10"></button>
          <button type="button" class="chip" data-value="10_25"  aria-pressed="false" data-i18n="sz_10_25"></button>
          <button type="button" class="chip" data-value="26_50"  aria-pressed="false" data-i18n="sz_26_50"></button>
          <button type="button" class="chip" data-value="gt50"   aria-pressed="false" data-i18n="sz_gt50"></button>
          <button type="button" class="chip" data-value="unsure" aria-pressed="false" data-i18n="sz_unsure"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <!-- data-multi: la pregunta original admite varias respuestas -->
      <div class="field">
        <label class="label"><span data-i18n="f_topics"></span><span class="req">*</span>
          <span class="hint" data-i18n="f_topics_hint"></span>
        </label>
        <div class="chips stack" data-name="temas" data-multi data-req>
          <button type="button" class="chip" data-value="stress"        aria-pressed="false" data-i18n="tp_stress"></button>
          <button type="button" class="chip" data-value="focus"         aria-pressed="false" data-i18n="tp_focus"></button>
          <button type="button" class="chip" data-value="burnout"       aria-pressed="false" data-i18n="tp_burnout"></button>
          <button type="button" class="chip" data-value="communication" aria-pressed="false" data-i18n="tp_communication"></button>
          <button type="button" class="chip" data-value="change"        aria-pressed="false" data-i18n="tp_change"></button>
          <button type="button" class="chip" data-value="trust"         aria-pressed="false" data-i18n="tp_trust"></button>
          <button type="button" class="chip" data-value="sales"         aria-pressed="false" data-i18n="tp_sales"></button>
          <button type="button" class="chip" data-value="tools"         aria-pressed="false" data-i18n="tp_tools"></button>
          <button type="button" class="chip" data-value="other"         aria-pressed="false" data-i18n="tp_other"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_session_lang"></span><span class="req">*</span></label>
        <div class="chips" data-name="idioma_sesion" data-req>
          <button type="button" class="chip" data-value="english" aria-pressed="false" data-i18n="sl_english"></button>
          <button type="button" class="chip" data-value="spanish" aria-pressed="false" data-i18n="sl_spanish"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <!-- ============ agenda ============ -->

      <div class="field">
        <label class="label"><span data-i18n="f_timing"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="plazo" data-req>
          <button type="button" class="chip" data-value="30d"       aria-pressed="false" data-i18n="tm_30d"></button>
          <button type="button" class="chip" data-value="2_3m"      aria-pressed="false" data-i18n="tm_2_3m"></button>
          <button type="button" class="chip" data-value="this_year" aria-pressed="false" data-i18n="tm_this_year"></button>
          <button type="button" class="chip" data-value="gathering" aria-pressed="false" data-i18n="tm_gathering"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_contact_pref"></span><span class="req">*</span></label>
        <div class="chips" data-name="preferencia_contacto" data-req>
          <button type="button" class="chip" data-value="email"    aria-pressed="false" data-i18n="cp_email"></button>
          <button type="button" class="chip" data-value="call"     aria-pressed="false" data-i18n="cp_call"></button>
          <button type="button" class="chip" data-value="whatsapp" aria-pressed="false" data-i18n="cp_whatsapp"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="nota"><span data-i18n="f_note"></span></label>
        <textarea id="nota" name="nota" data-i18n-ph="ph_note"></textarea>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="consent">
          <input type="checkbox" name="consentimiento" data-req>
          <span data-i18n="consent"></span>
        </label>
        <span class="field-err"></span>
      </div>

      <div class="actions">
        <button type="submit" class="submit" data-i18n="submit"></button>
        <p class="legal" data-i18n="legal"></p>
      </div>

    </form>
  </div>

  <div class="done">
    <div class="mark"></div>
    <h2 data-i18n="done_title"></h2>
    <p data-i18n="done_text"></p>
    <div class="queued" data-i18n="queued"></div>
    <button type="button" class="again" data-i18n="again"></button>
  </div>

  <footer>CIELO Breathwork · cielobreathwork.com</footer>
</div>

    var mapa = { '30d': 'now', '2_3m': 'quarter', 'this_year': 'quarter', 'gathering': 'exploring' };

<script src="assets/form-kit.js"></script>
</body>
</html>
